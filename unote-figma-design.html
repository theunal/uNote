<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uNote — Tasarım Kanvası (Figma)</title>
<style>
  :root{
    --radius-s:6px; --radius-m:10px; --radius-window:8px;
    --titlebar-h:40px; --statusbar-h:28px; --sidebar-w:220px; --sidebar-collapsed-w:52px;
    --shadow-pop:0 12px 32px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12);
    --shadow-1:0 1px 2px rgba(0,0,0,.06);
    --shadow-2:0 4px 14px rgba(0,0,0,.12);
    --ring:0 0 0 3px var(--accent-soft);
    --font-ui:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --font-mono:"Cascadia Code","Consolas",monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  html[data-theme="light"]{
    --bg:#F3F3F3; --surface:#FFFFFF; --surface-hover:#F9F9F9; --surface-pressed:#F0F0F0;
    --accent:#0078D4; --accent-strong:#106EBE; --text:#1A1A1A; --text-secondary:#616161;
    --border:#E0E0E0; --separator:#E6E6E6; --danger:#C83232;
    --accent-soft:rgba(0,120,212,.12); --accent-border:rgba(0,120,212,.5);
    --danger-soft:rgba(200,50,50,.14);
    --glass:rgba(255,255,255,.8); --glass-strong:rgba(255,255,255,.92);
    --frame-bg:#E6E6E6; --canvas:#F0F0F0; --card:#FFFFFF;
  }
  html[data-theme="dark"]{
    --bg:#202020; --surface:#2D2D2D; --surface-hover:#383838; --surface-pressed:#444444;
    --accent:#60CDFF; --accent-strong:#4CC2FF; --text:#FFFFFF; --text-secondary:#9E9E9E;
    --border:#404040; --separator:#373737; --danger:#FF6464;
    --accent-soft:rgba(96,205,255,.14); --accent-border:rgba(96,205,255,.55);
    --danger-soft:rgba(255,100,100,.16);
    --glass:rgba(45,45,45,.78); --glass-strong:rgba(50,50,50,.94);
    --frame-bg:#1E1E1E; --canvas:#232323; --card:#2B2B2B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-ui);color:var(--text);background:var(--canvas);min-height:100vh;-webkit-font-smoothing:antialiased}

  /* ---- Top toolbar ---- */
  .toolbar{
    position:sticky;top:0;z-index:100;height:52px;display:flex;align-items:center;gap:16px;
    padding:0 20px;background:var(--glass-strong);backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid var(--border);
  }
  .toolbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:-.01em}
  .toolbar .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
  .toolbar .file{font-size:12.5px;color:var(--text-secondary);padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
  .toolbar .spacer{flex:1}
  .toolbar .hint{font-size:12px;color:var(--text-secondary)}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px}
  .seg button{border:none;background:none;font:inherit;font-size:12.5px;padding:6px 14px;border-radius:6px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .14s,color .14s}
  .seg button:hover{color:var(--text)}
  .seg button.active{background:var(--accent-soft);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--accent-border)}

  /* ---- Canvas ---- */
  .canvas{padding:34px 28px 80px}
  .frame-section{margin-bottom:44px}
  .frame-section-title{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text-secondary);margin-bottom:16px}
  .frame-section-title .bar{width:3px;height:14px;border-radius:2px;background:var(--accent)}
  .frames{display:flex;flex-wrap:wrap;gap:30px}

  /* ---- Frame (artboard) ---- */
  .frame-shell{
    width:560px;position:relative;
  }
  .frame-label{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);
    margin-bottom:10px;
  }
  .frame-label .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .frame-label .tag{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary)}
  .frame-bg{
    background:var(--frame-bg);border:1px solid var(--border);border-radius:12px;padding:16px;
    position:relative;
  }
  .win-scale{transform:scale(.56);transform-origin:top left;width:1000px;height:650px;overflow:hidden;border-radius:8px}
  /* account for scale: shell height = 650*0.56 + padding */
  .win{position:absolute;width:1000px;height:650px}

  /* ---- App primitives (reused) ---- */
  .win{
    display:flex;flex-direction:column;background:var(--glass);
    backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--border);border-radius:8px;box-shadow:0 18px 48px rgba(0,0,0,.25);
    overflow:hidden;user-select:none;
  }
  .titlebar{height:var(--titlebar-h);flex:0 0 var(--titlebar-h);display:flex;align-items:stretch;background:var(--glass);border-bottom:1px solid var(--separator)}
  .drag{flex:1 1 auto;display:flex;align-items:stretch;overflow:hidden;min-width:0}
  .tabs{display:flex;align-items:flex-end;gap:2px;overflow:hidden;min-width:0;padding:6px 0 0 8px}
  .tab{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;white-space:nowrap;border-radius:6px 6px 0 0;position:relative;color:var(--text-secondary);font-size:12.5px;transition:background .14s var(--ease);max-width:200px;cursor:default}
  .tab .tab-title{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tab:hover{background:var(--surface-hover);color:var(--text)}
  .tab.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
  .tab .lock{font-size:10px;opacity:.75}
  .tab-close{width:18px;height:18px;flex:0 0 auto;display:grid;place-items:center;border-radius:5px;font-size:11px;color:var(--text-secondary);transition:background .12s,color .12s}
  .tab-close:hover{background:var(--surface-pressed);color:var(--text)}
  .icon-btn{width:34px;flex:0 0 auto;display:grid;place-items:center;align-self:center;height:34px;border-radius:6px;cursor:default;color:var(--text-secondary);transition:background .12s,color .12s;font-size:16px}
  .icon-btn:hover{background:var(--surface-hover);color:var(--text)}
  .tbar-right{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px}
  .searchbox{display:flex;align-items:center;gap:8px;height:32px;width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 10px;color:var(--text-secondary);font-size:12.5px}
  .searchbox svg{flex:0 0 auto;opacity:.7}
  .searchbox input{border:none;background:none;outline:none;width:100%;font:inherit;color:var(--text)}
  .searchbox input::placeholder{color:var(--text-secondary)}
  .searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .winctrl{flex:0 0 auto;display:flex;align-items:stretch}
  .wc-btn{width:46px;display:grid;place-items:center;color:var(--text-secondary);transition:background .12s,color .12s}
  .wc-btn svg{width:11px;height:11px}
  .wc-btn:hover{background:var(--surface-hover);color:var(--text)}
  .wc-btn.close:hover{background:var(--danger);color:#fff}
  .content{flex:1 1 auto;display:flex;min-height:0}
  .sidebar{flex:0 0 var(--sidebar-w);width:var(--sidebar-w);display:flex;flex-direction:column;border-right:1px solid var(--separator);background:var(--glass);transition:flex-basis .22s var(--ease),width .22s var(--ease);min-height:0;overflow:hidden}
  .sidebar.collapsed{flex-basis:var(--sidebar-collapsed-w);width:var(--sidebar-collapsed-w)}
  .sidebar-head{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--separator)}
  .hamburger{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:6px;color:var(--text-secondary);transition:background .12s,color .12s}
  .hamburger:hover{background:var(--surface-hover);color:var(--text)}
  .sidebar-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
  .sidebar-count{font-size:11.5px;color:var(--text-secondary);margin-left:auto;white-space:nowrap}
  .note-list{flex:1 1 auto;overflow:hidden;padding:6px;display:flex;flex-direction:column;gap:2px}
  .note-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:6px;position:relative;color:var(--text);transition:background .12s var(--ease)}
  .sidebar.collapsed .note-item{justify-content:center;padding:0}
  .note-item:hover{background:var(--surface-hover)}
  .note-item.selected{background:var(--accent-soft)}
  .note-item.selected::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
  .avatar{width:26px;height:26px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;letter-spacing:.02em}
  .note-title{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .sidebar.collapsed .note-title,.sidebar.collapsed .note-lock{display:none}
  .note-lock{margin-left:auto;font-size:11px;color:var(--text-secondary);flex:0 0 auto}
  .main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:var(--glass)}
  .editor-wrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:14px 16px;gap:10px}
  .editor-meta{flex:0 0 auto;display:flex;align-items:center;gap:12px}
  .editor-title{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .lock-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);padding:3px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
  .saved-flag{margin-left:auto;font-size:11.5px;color:var(--text-secondary)}
  textarea.editor{flex:1 1 auto;resize:none;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:16px;font-family:var(--font-mono);font-size:14px;line-height:1.6;outline:none;min-height:0;white-space:pre-wrap;word-break:break-word}
  textarea.editor:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .hero-empty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-secondary)}
  .hero-empty .logo{font-size:56px;font-weight:700;color:var(--accent);letter-spacing:-.02em}
  .hero-empty p{font-size:14px}
  .settings{flex:1 1 auto;overflow:hidden;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
  .settings h2{font-size:24px;font-weight:600;letter-spacing:-.01em}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
  .card h3{font-size:14px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em}
  .seg{display:inline-flex;background:var(--surface-hover);border-radius:6px;padding:3px}
  .seg button{border:none;background:none;font:inherit;font-size:13px;padding:6px 14px;border-radius:5px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
  .seg button.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--accent-border),0 1px 3px rgba(0,0,0,.1)}
  .row{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .row .lbl{font-size:13.5px}
  .row .sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
  .slider{flex:1 1 auto}
  input[type="range"]{width:100%;accent-color:var(--accent);height:20px}
  .size-val{font-family:var(--font-mono);font-size:13px;min-width:44px;text-align:right;color:var(--text)}
  .preview{font-family:var(--font-mono);font-size:14px;padding:14px;border-radius:6px;background:var(--surface-hover);border:1px solid var(--border);color:var(--text)}
  .check{display:flex;align-items:center;gap:10px}
  .check input{width:16px;height:16px;accent-color:var(--accent)}
  .check .lbl{font-size:13.5px}
  .statusbar{height:var(--statusbar-h);flex:0 0 var(--statusbar-h);display:flex;align-items:center;padding:0 12px;gap:10px;font-size:11.5px;color:var(--text-secondary);background:var(--glass);border-top:1px solid var(--separator)}
  .statusbar .sep{opacity:.5}
  .theme-ind{display:inline-flex;align-items:center;gap:5px;margin-left:auto}
  .menu{position:absolute;z-index:50;min-width:200px;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);padding:4px}
  .menu-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--text);transition:background .12s}
  .menu-item:hover{background:var(--surface-hover)}
  .menu-item.danger{color:var(--danger)}
  .menu-item .mi-ico{width:18px;text-align:center;color:var(--text-secondary)}
  .menu-item.danger .mi-ico{color:var(--danger)}
  .menu-sep{height:1px;background:var(--separator);margin:4px 6px}
  .menu-head{padding:8px 10px 6px;font-size:11.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .overlay{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
  .dialog{width:340px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);padding:22px;display:flex;flex-direction:column;gap:8px;text-align:center}
  .dialog .d-logo{font-size:34px;font-weight:700;color:var(--accent);letter-spacing:-.02em}
  .dialog h3{font-size:17px;font-weight:600}
  .dialog p{font-size:12.5px;color:var(--text-secondary);line-height:1.5}
  .dialog .version{font-size:11.5px;color:var(--text-secondary);margin-top:2px}
  .btn{border:none;font:inherit;font-size:13px;padding:8px 18px;border-radius:6px;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--accent-strong)}
  .btn.dialog-ok{margin-top:14px}
  .empty-msg{padding:20px 12px;color:var(--text-secondary);font-size:12.5px;text-align:center}
  .sidebar.collapsed .empty-msg{font-size:14px;padding:16px 0}
  .caption{position:absolute;bottom:8px;right:12px;font-size:10px;color:var(--text-secondary);opacity:.7}

  /* ---- Accessibility: focus rings ---- */
  :focus{outline:none}
  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-radius:4px;
  }
  .seg button:focus-visible,.icon-btn:focus-visible,.tab-close:focus-visible,
  .wc-btn:focus-visible,.hamburger:focus-visible,.menu-item:focus-visible,
  .btn:focus-visible,.note-item:focus-visible,.tab:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;
  }
  .seg button:hover{color:var(--text);background:var(--surface-hover)}
  .seg button:active{transform:scale(.98)}

  /* ---- High-quality control states ---- */
  .seg button{transition:background .14s var(--ease),color .14s var(--ease),transform .08s var(--ease),box-shadow .14s var(--ease)}
  .seg button:active{transform:scale(.97)}
  .seg button.active{box-shadow:0 0 0 1px var(--accent-border),var(--ring)}
  .icon-btn,.hamburger,.tab-close,.wc-btn{transition:background .12s var(--ease),color .12s var(--ease),transform .08s var(--ease)}
  .icon-btn:active,.hamburger:active,.tab-close:active{transform:scale(.9)}
  .wc-btn:active{background:var(--surface-pressed)}
  .searchbox{transition:border-color .14s var(--ease),box-shadow .14s var(--ease),background .14s var(--ease)}
  .searchbox:hover{border-color:var(--text-secondary);background:var(--surface-hover)}
  .searchbox:focus-within{background:var(--surface);box-shadow:var(--ring)}
  .note-item{transition:background .12s var(--ease),box-shadow .12s var(--ease)}
  .note-item.selected{box-shadow:inset 0 0 0 1px var(--accent-border)}
  .note-item:active{transform:scale(.99)}
  .menu{animation:menuIn .16s var(--ease);transform-origin:top left}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  .menu-item{transition:background .12s var(--ease),color .12s var(--ease)}
  .menu-item:hover{background:var(--surface-pressed)}
  .menu-item.danger:hover{background:var(--danger-soft)}
  .btn{transition:background .14s var(--ease),transform .08s var(--ease),box-shadow .14s var(--ease),color .14s var(--ease)}
  .btn:active{transform:scale(.98)}
  .btn.primary{box-shadow:0 2px 6px rgba(0,0,0,.16)}
  .btn.primary:hover{background:var(--accent-strong);box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .btn.primary:active{box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .check label,label.check{transition:color .12s var(--ease)}
  .check:hover .lbl{color:var(--text)}
  .check input{transition:box-shadow .12s var(--ease)}
  .check input:checked{box-shadow:var(--ring)}
  .dialog-ok{min-width:110px}
  .toolbar .file{transition:border-color .14s var(--ease),background .14s var(--ease),color .14s var(--ease)}
  .toolbar .file:hover{border-color:var(--text-secondary);background:var(--surface-hover)}

  /* ---- Responsive hardening ---- */
  .frames{overflow-x:auto;padding-bottom:8px}
  .frame-shell{width:min(560px,calc(100vw - 56px))}
  @media (max-width:640px){
    .toolbar{gap:10px;padding:0 12px;flex-wrap:wrap;height:auto;min-height:52px;padding-top:8px;padding-bottom:8px}
    .toolbar .hint{display:none}
    .searchbox{width:150px}
    .canvas{padding:24px 14px 60px}
    .frame-bg{padding:10px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<div class="toolbar" data-od-id="toolbar">
  <div class="brand"><div class="logo" aria-hidden="true">u</div> uNote</div>
  <div class="file">unote-figma-design</div>
  <div class="spacer"></div>
  <div class="hint">Etkileşimli çerçeveler — tıklayıp deneyin</div>
  <div class="seg" id="themeToggle" role="group" aria-label="Tema seçimi">
    <button data-t="light" class="active" aria-pressed="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Açık
    </button>
    <button data-t="dark" aria-pressed="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      Koyu
    </button>
  </div>
</div>

<div class="canvas" id="canvas"></div>

<script>
(function(){
  const AVATAR_COLORS=['#C03A9B','#3A9BC0','#7B5BA7','#C07A3A','#3AC08A','#C0505A','#5A9BC0','#9B7BC0'];
  let theme = localStorage.getItem('unote-theme')||'light';
  const notes=[
    {id:1,title:'Alışveriş listesi',locked:false,body:'Haftalık market listesi:\n- Süt ve yoğurt\n- Tam buğday ekmeği\n- Zeytinyağı\n- Kahve (çekirdek)'},
    {id:2,title:'Proje fikirleri',locked:false,body:'Yeni ürün fikirleri:\n1. Kişisel bilgi yönetimi\n2. Şifre yöneticisi\n3. Çoklu cihaz senkronizasyonu'},
    {id:3,title:'Toplantı notları',locked:true,body:'* Bu not kilitli.'},
    {id:4,title:'Seyahat planı',locked:false,body:'İstanbul gezisi:\n- Konaklama: Kadıköy\n- Ulaşım: vapur'},
    {id:5,title:'Şifre notu',locked:true,body:'* Bu not kilitli.'},
    {id:6,title:'Yeni not',locked:false,body:''},
  ];
  const trunc=(s,n)=>s.length>n? s.slice(0,n-1)+'…':s;

  function applyTheme(t){document.documentElement.setAttribute('data-theme',t);
    document.querySelectorAll('#themeToggle button').forEach(b=>{
      const on=b.dataset.t===t;
      b.classList.toggle('active',on); b.setAttribute('aria-pressed',on);
    });}

  function svgSearch(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>';}
  function svgLock(){return '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';}
  function svgGear(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>';}
  function svgInfo(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>';}
  function svgTrash(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';}
  function svgSun(){return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';}
  function svgMoon(){return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';}
  function svgMonitor(){return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';}
  function themeSeg(){return '<button class="active">'+svgSun()+' Açık</button><button>'+svgMoon()+' Koyu</button><button>'+svgMonitor()+' Sistem</button>';}
  function themeIcon(){return theme==='dark'?svgMoon():svgSun();}
  function themeLabel(){return theme==='dark'?'Koyu':'Açık';}

  // build one interactive window into a shell
  function buildWindow(shell, cfg){
    const w=document.createElement('div'); w.className='win';
    w.innerHTML = `
      <div class="titlebar">
        <div class="drag">
          <div class="tabs">${cfg.tabs.map((id,i)=>{
            const n=notes.find(x=>x.id===id)||notes[notes.length-1];
            return `<div class="tab${id===cfg.active?' active':''}" data-id="${id}" role="tab" tabindex="0" aria-selected="${id===cfg.active}"><span class="lock">${n.locked?svgLock():''}</span><span class="tab-title">${trunc(n.title,15)}</span><span class="tab-close" role="button" aria-label="Sekmeyi kapat">×</span></div>`;
          }).join('')}</div>
          <div class="icon-btn" data-btn="add">+</div>
          <div class="icon-btn" data-btn="chev">▾</div>
        </div>
        <div class="tbar-right"><div class="searchbox" role="search">${svgSearch()}<input placeholder="Notlarda ara..." aria-label="Notlarda ara" value="${cfg.query||''}"></div></div>
        <div class="winctrl">
          <div class="wc-btn">${'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1"><line x1="0" y1="5" x2="10" y2="5"/></svg>'}</div>
          <div class="wc-btn">${'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="0.5" y="0.5" width="9" height="9" rx="1"/></svg>'}</div>
          <div class="wc-btn close">${'<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1"><line x1="0" y1="0" x2="10" y2="10"/><line x1="10" y1="0" x2="0" y2="10"/></svg>'}</div>
        </div>
      </div>
      <div class="content">
        <aside class="sidebar${cfg.collapsed?' collapsed':''}">
          <div class="sidebar-head">
            <div class="hamburger">${'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>'}</div>
            <div class="sidebar-title">${cfg.collapsed?'':'Notlar'}</div>
            <div class="sidebar-count">${cfg.collapsed?'':notes.length+' not'}</div>
          </div>
          <div class="note-list">
            ${notes.filter(n=>!cfg.query||n.title.toLowerCase().includes(cfg.query.toLowerCase())||n.body.toLowerCase().includes(cfg.query.toLowerCase())).map(n=>`
              <div class="note-item${n.id===cfg.selected?' selected':''}" data-note="${n.id}" role="button" tabindex="0">
                <div class="avatar" style="background:${AVATAR_COLORS[n.id%8]}" aria-hidden="true">${n.title.slice(0,3).toUpperCase()}</div>
                <span class="note-title">${n.title}</span><span class="note-lock" aria-hidden="true">${n.locked?svgLock():''}</span>
              </div>`).join('') || '<div class="empty-msg">'+(cfg.collapsed?'-':'Henüz not yok')+'</div>'}
          </div>
        </aside>
        <main class="main">
          ${cfg.view==='settings' ? `
            <div class="settings">
              <h2>Ayarlar</h2>
              <div class="card"><h3>Tema</h3>
                <div class="seg">${themeSeg()}</div>
              </div>
              <div class="card"><h3>Metin Biçimlendirme</h3>
                <div class="row"><div><div class="lbl">Yazı Tipi</div><div class="sub">Consolas (Monospace)</div></div></div>
                <div class="row"><div class="lbl">Boyut</div><input type="range" class="slider" min="8" max="24" value="14"><div class="size-val">14px</div></div>
                <div class="preview">AaBbCc 123!@# — The quick brown fox</div>
                <label class="check"><input type="checkbox" checked><span class="lbl">Satır Kaydırma</span></label>
                <label class="check"><input type="checkbox"><span class="lbl">Biçimlendirme (Zengin Metin)</span></label>
              </div>
              <div class="card"><h3>Gelişmiş</h3>
                <label class="check"><input type="checkbox" checked><span class="lbl">Başlangıçta sekmeleri geri yükle</span></label>
              </div>
            </div>`
          : cfg.active===null ? `
            <div class="hero-empty"><div class="logo">uNote</div><p>Bir not seçin veya yeni bir not oluşturun</p></div>`
          : (()=>{const n=notes.find(x=>x.id===cfg.active);
            return `<div class="editor-wrap">
              <div class="editor-meta">
                <div class="editor-title">${n.title}</div>
                ${n.locked?'<span class="lock-badge">'+svgLock()+' Kilitli</span>':''}
                <div class="saved-flag">Otomatik kaydedildi</div>
              </div>
              <textarea class="editor" spellcheck="false">${n.locked?'* Bu not kilitli.':n.body}</textarea>
            </div>`;})()}
        </main>
      </div>
      <div class="statusbar">
        <span>uNote v0.1.0</span><span class="sep">|</span><span>${notes.length} not</span>
        <span class="sep">|</span><span>${cfg.active===null?'Notlar':(notes.find(x=>x.id===cfg.active)?.title||'Ayarlar')}</span>
        <span class="theme-ind" aria-hidden="true">${themeIcon()} ${themeLabel()}</span>
      </div>
      ${cfg.menu==='app'?`
        <div class="menu" style="left:60px;top:44px" role="menu">
          <div class="menu-item" role="menuitem" tabindex="0"><span class="mi-ico">${svgGear()}</span> Ayarlar</div>
          <div class="menu-item" role="menuitem" tabindex="0"><span class="mi-ico">${svgInfo()}</span> Hakkında</div>
        </div>`:''}
      ${cfg.menu==='ctx'?`
        <div class="menu" style="left:${cfg.ctxX||130}px;top:${cfg.ctxY||180}px" role="menu">
          <div class="menu-head">${trunc(notes.find(x=>x.id===cfg.ctxId)?.title||'',20)}</div>
          <div class="menu-sep"></div>
          <div class="menu-item danger" role="menuitem" tabindex="0"><span class="mi-ico">${svgTrash()}</span> Notu Sil</div>
        </div>`:''}
      ${cfg.menu==='about'?`
        <div class="overlay" role="presentation">
          <div class="dialog" role="dialog" aria-modal="true" aria-label="Hakkında">
            <div class="d-logo">uNote</div><h3>Güvenli Not Alma Kasası</h3>
            <p>Notlarınız AES-256-GCM ile şifrelenir ve yerel olarak saklanır.</p>
            <div class="version">Sürüm 0.1.0 · Rust + egui</div>
            <button class="btn primary dialog-ok" data-od-id="about-ok">Tamam</button>
          </div>
        </div>`:''}
      <div class="caption">1000 × 650</div>
    `;
    // interactions
    const state={...cfg};
    w.querySelector('.hamburger').addEventListener('click',()=>{state.collapsed=!state.collapsed;
      const sb=w.querySelector('.sidebar');sb.classList.toggle('collapsed',state.collapsed);
      sb.querySelectorAll('.sidebar-title,.sidebar-count').forEach(e=>e.textContent=state.collapsed?'':(e.classList.contains('sidebar-title')?'Notlar':notes.length+' not'));});
    w.querySelectorAll('.note-item').forEach(it=>it.addEventListener('click',()=>{
      w.querySelectorAll('.note-item').forEach(x=>x.classList.remove('selected'));
      it.classList.add('selected');
      const id=+it.dataset.note; state.selected=id; state.active=id;
      renderMain(w,state);
    }));
    w.querySelectorAll('.note-item').forEach(it=>it.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();it.click();}
    }));
    w.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
      const id=+t.dataset.id; if(!isNaN(id)){state.active=id; renderMain(w,state);}
    }));
    w.querySelectorAll('.tab').forEach(t=>t.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click();}
    }));
    w.querySelectorAll('.tab-close').forEach(c=>c.addEventListener('click',(e)=>{e.stopPropagation();
      const t=c.closest('.tab');const id=+t.dataset.id;const i=state.tabs.indexOf(id);if(i>=0){state.tabs.splice(i,1);
        if(state.active===id) state.active=state.tabs.length?state.tabs[state.tabs.length-1]:null; renderAll(w,state);}}));
    w.querySelector('[data-btn="add"]').addEventListener('click',()=>{state.tabs.push(6);state.active=6;renderAll(w,state);});
    w.querySelector('[data-btn="chev"]').addEventListener('click',()=>{state.menu=state.menu==='app'?null:'app';renderMenus(w,state);});
    const inp=w.querySelector('.searchbox input');
    inp.addEventListener('input',()=>{state.query=inp.value;renderSidebar(w,state);});
    shell.appendChild(w);
    return {w,state,renderMain,renderAll,renderMenus,renderSidebar};
  }
  function renderMain(w,s){
    const main=w.querySelector('.main');
    if(s.view==='settings'){
      main.innerHTML=`<div class="settings"><h2>Ayarlar</h2>
        <div class="card"><h3>Tema</h3><div class="seg">${themeSeg()}</div></div>
        <div class="card"><h3>Metin Biçimlendirme</h3>
          <div class="row"><div><div class="lbl">Yazı Tipi</div><div class="sub">Consolas (Monospace)</div></div></div>
          <div class="row"><div class="lbl">Boyut</div><input type="range" class="slider" min="8" max="24" value="14"><div class="size-val">14px</div></div>
          <div class="preview">AaBbCc 123!@# — The quick brown fox</div>
          <label class="check"><input type="checkbox" checked><span class="lbl">Satır Kaydırma</span></label>
          <label class="check"><input type="checkbox"><span class="lbl">Biçimlendirme (Zengin Metin)</span></label></div>
        <div class="card"><h3>Gelişmiş</h3><label class="check"><input type="checkbox" checked><span class="lbl">Başlangıçta sekmeleri geri yükle</span></label></div></div>`;
      return;
    }
    if(s.active===null){main.innerHTML=`<div class="hero-empty"><div class="logo">uNote</div><p>Bir not seçin veya yeni bir not oluşturun</p></div>`;return;}
    const n=notes.find(x=>x.id===s.active); if(!n)return;
    main.innerHTML=`<div class="editor-wrap">
      <div class="editor-meta"><div class="editor-title">${n.title}</div>${n.locked?'<span class="lock-badge">'+svgLock()+' Kilitli</span>':''}<div class="saved-flag">Otomatik kaydedildi</div></div>
      <textarea class="editor" spellcheck="false">${n.locked?'* Bu not kilitli.':n.body}</textarea></div>`;
    w.querySelector('.statusbar .theme-ind').innerHTML = themeIcon()+' '+themeLabel();
  }
  function renderAll(w,s){ renderMain(w,s); const active=w.querySelector('.tab.active'); const tb=w.querySelectorAll('.tab');tb.forEach((t,i)=>{const id=+t.dataset.id;t.classList.toggle('active',id===s.active);}); }
  function renderMenus(w,s){ w.querySelectorAll('.menu').forEach(m=>m.remove()); w.querySelectorAll('.overlay').forEach(o=>o.remove());
    if(s.menu==='app'){w.insertAdjacentHTML('beforeend',`<div class="menu" style="left:60px;top:44px" role="menu"><div class="menu-item" role="menuitem" tabindex="0"><span class="mi-ico">${svgGear()}</span> Ayarlar</div><div class="menu-item" role="menuitem" tabindex="0"><span class="mi-ico">${svgInfo()}</span> Hakkında</div></div>`);
      w.querySelector('.menu').addEventListener('click',e=>{const it=e.target.closest('.menu-item');if(!it)return;const t=it.textContent.trim();
        if(t.includes('Ayarlar')){s.view='settings';renderMain(w,s);} if(t.includes('Hakkında')){s.menu='about';renderMenus(w,s);}});}
    else if(s.menu==='about'){w.insertAdjacentHTML('beforeend',`<div class="overlay" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-label="Hakkında"><div class="d-logo">uNote</div><h3>Güvenli Not Alma Kasası</h3><p>Notlarınız AES-256-GCM ile şifrelenir ve yerel olarak saklanır.</p><div class="version">Sürüm 0.1.0 · Rust + egui</div><button class="btn primary dialog-ok" data-od-id="about-ok">Tamam</button></div></div>`);
      w.querySelector('.dialog-ok').addEventListener('click',()=>{s.menu=null;renderMenus(w,s);});}
  }
  function renderSidebar(w,s){const list=w.querySelector('.note-list');
    list.innerHTML=notes.filter(n=>!s.query||n.title.toLowerCase().includes(s.query.toLowerCase())||n.body.toLowerCase().includes(s.query.toLowerCase())).map(n=>`
      <div class="note-item${n.id===s.selected?' selected':''}" data-note="${n.id}" role="button" tabindex="0">
        <div class="avatar" style="background:${AVATAR_COLORS[n.id%8]}" aria-hidden="true">${n.title.slice(0,3).toUpperCase()}</div>
        <span class="note-title">${n.title}</span><span class="note-lock" aria-hidden="true">${n.locked?svgLock():''}</span></div>`).join('')||'<div class="empty-msg">'+(s.collapsed?'-':'Henüz not yok')+'</div>';
    list.querySelectorAll('.note-item').forEach(it=>it.addEventListener('click',()=>{
      list.querySelectorAll('.note-item').forEach(x=>x.classList.remove('selected'));it.classList.add('selected');
      const id=+it.dataset.note;s.selected=id;s.active=id;renderMain(w,s);renderAll(w,s);}));
    list.querySelectorAll('.note-item').forEach(it=>it.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();it.click();}}));}

  // ---- Frames ----
  const frames=[
    {section:'Ana Akış', title:'Editör — Açık Tema', tag:'Interaktif', cfg:{tabs:[1,2],active:1,selected:1,view:'editor',collapsed:false,query:'',menu:null,ctxX:130,ctxY:180}},
    {section:'Ana Akış', title:'Boş Durum', tag:'Interaktif', cfg:{tabs:[],active:null,selected:null,view:'editor',collapsed:false,query:'',menu:null,ctxX:130,ctxY:180}},
    {section:'Ana Akış', title:'Ayarlar Sekmesi', tag:'Interaktif', cfg:{tabs:[1,-1],active:-1,selected:1,view:'settings',collapsed:false,query:'',menu:null,ctxX:130,ctxY:180}},
    {section:'Menüler & Popup', title:'▾ Uygulama Menüsü', tag:'Interaktif', cfg:{tabs:[1,2],active:1,selected:1,view:'editor',collapsed:false,query:'',menu:'app',ctxX:130,ctxY:180}},
    {section:'Menüler & Popup', title:'Hakkında Popup', tag:'Interaktif', cfg:{tabs:[1,2],active:1,selected:1,view:'editor',collapsed:false,query:'',menu:'about',ctxX:130,ctxY:180}},
    {section:'Menüler & Popup', title:'Not Bağlam Menüsü', tag:'Interaktif', cfg:{tabs:[3],active:3,selected:3,view:'editor',collapsed:false,query:'',menu:'ctx',ctxId:3,ctxX:150,ctxY:150}},
    {section:'Varyasyonlar', title:'Daraltılmış Kenar Çubuğu', tag:'Interaktif', cfg:{tabs:[1],active:1,selected:1,view:'editor',collapsed:true,query:'',menu:null,ctxX:130,ctxY:180}},
    {section:'Varyasyonlar', title:'Canlı Arama', tag:'Interaktif', cfg:{tabs:[1,4],active:4,selected:4,view:'editor',collapsed:false,query:'seyahat',menu:null,ctxX:130,ctxY:180}},
  ];

  const canvas=$('canvas');
  const sections=[...new Set(frames.map(f=>f.section))];
  sections.forEach(sec=>{
    const secEl=document.createElement('section'); secEl.className='frame-section';
    secEl.dataset.odId = 'section-'+sec.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    secEl.innerHTML=`<div class="frame-section-title" data-od-id="section-heading"><span class="bar"></span>${sec}</div>`;
    const grid=document.createElement('div'); grid.className='frames';
    frames.filter(f=>f.section===sec).forEach(f=>{
      const shell=document.createElement('div'); shell.className='frame-shell';
      shell.dataset.odId = 'frame-'+f.title.toLowerCase().replace(/[^a-z0-9]+/g,'-');
      shell.innerHTML=`<div class="frame-label"><span class="dot" aria-hidden="true"></span>${f.title}<span class="tag">${f.tag}</span></div>`;
      const bg=document.createElement('div'); bg.className='frame-bg';
      const scale=document.createElement('div'); scale.className='win-scale'; scale.style.height=Math.round(650*.56)+'px';
      bg.appendChild(scale);
      const snap=buildWindow(scale,{...f.cfg});
      shell.appendChild(bg); grid.appendChild(shell);
    });
    secEl.appendChild(grid); canvas.appendChild(secEl);
  });

  applyTheme(theme);
  document.getElementById('themeToggle').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    theme=b.dataset.t; localStorage.setItem('unote-theme',theme); applyTheme(theme);
    document.querySelectorAll('.win .theme-ind').forEach(el=>el.innerHTML=themeIcon()+' '+themeLabel());
  });
  function $(id){return document.getElementById(id);}
})();
</script>
</body>
</html>
