[package]
name = "uNote-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.11"
base64 = "0.23.1"
rand = "0.10.2"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
window-vibrancy = "0.8"
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }
